hmac = "0.12.1"
rand = "0.8.5"
ed25519-dalek = "2.1.1"
aya = "0.12"
bytes = "1.5.0"
caps = "0.5.5"
yara-x = "0.5.0"
tlsh-fixed = "0.1.1"
ureq = "2.9.6"
signal-hook = "0.3"
