<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11e16f" />
      <stop offset="100%" stop-color="#0ad3ff" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#11e16f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Main Shield Shape -->
  <path d="M256 40 C360 40 430 75 445 85 C445 220 370 380 256 472 C142 380 67 220 67 85 C82 75 152 40 256 40 Z" 
        fill="#121824" stroke="url(#shield-grad)" stroke-width="24" stroke-linejoin="round" filter="url(#drop-shadow)" />
  <!-- Inner Shield / Core -->
  <path d="M256 80 C330 80 385 105 397 113 C397 220 338 340 256 418 C174 340 115 220 115 113 C127 105 182 80 256 80 Z" 
        fill="url(#shield-grad)" opacity="0.1" />
  <!-- Stylized "FS" Text -->
  <text x="256" y="305" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" 
        fill="url(#shield-grad)" text-anchor="middle" letter-spacing="-6">FS</text>
</svg>
